services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: dealflow
      MYSQL_USER: dealflow
      MYSQL_PASSWORD: dealflow
      MYSQL_ROOT_PASSWORD: dealflow_root
    ports: ["3307:3306"]
    volumes: ["mysqldata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dealflow", "-pdealflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: mysql+pymysql://dealflow:dealflow@mysql:3306/dealflow
    ports: ["8000:8000"]
    depends_on:
      mysql: {condition: service_healthy}
    volumes: 
      - "./api:/srv"
      - "./web:/web:ro"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22-alpine
    working_dir: /srv
    environment:
      VITE_API_BASE: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
    volumes: ["./web:/srv"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysqldata:

